<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs>
    <linearGradient id="perm-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0369a1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#perm-gradient)"/>
  <g font-family="monospace" fill="#ffffff">
    <text x="480" y="84" text-anchor="middle" font-size="33" font-weight="bold" opacity="0.96">Least Privilege on One Server</text>
    <text x="480" y="122" text-anchor="middle" font-size="19" fill="#bae6fd" opacity="0.9">admin · deploy · infra</text>

    <rect x="80" y="180" width="240" height="132" rx="14" fill="#0b1220" opacity="0.6" stroke="#38bdf8" stroke-width="2"/>
    <text x="200" y="226" text-anchor="middle" font-size="25" font-weight="bold" fill="#38bdf8">admin</text>
    <text x="200" y="258" text-anchor="middle" font-size="15" fill="#e2e8f0">系统与入口</text>
    <text x="200" y="286" text-anchor="middle" font-size="14" fill="#94a3b8">sudo · nginx · 80/443</text>

    <rect x="360" y="180" width="240" height="132" rx="14" fill="#0b1220" opacity="0.6" stroke="#22c55e" stroke-width="2"/>
    <text x="480" y="226" text-anchor="middle" font-size="25" font-weight="bold" fill="#22c55e">deploy</text>
    <text x="480" y="258" text-anchor="middle" font-size="15" fill="#e2e8f0">应用部署与运行</text>
    <text x="480" y="286" text-anchor="middle" font-size="14" fill="#94a3b8">无 sudo · 127.0.0.1:3000</text>

    <rect x="640" y="180" width="240" height="132" rx="14" fill="#0b1220" opacity="0.6" stroke="#f59e0b" stroke-width="2"/>
    <text x="760" y="226" text-anchor="middle" font-size="25" font-weight="bold" fill="#f59e0b">infra</text>
    <text x="760" y="258" text-anchor="middle" font-size="15" fill="#e2e8f0">共享基础设施</text>
    <text x="760" y="286" text-anchor="middle" font-size="14" fill="#94a3b8">nologin · pg/redis/minio</text>

    <line x1="200" y1="330" x2="200" y2="376" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
    <line x1="480" y1="330" x2="480" y2="376" stroke="#22c55e" stroke-width="2" opacity="0.6"/>
    <line x1="760" y1="330" x2="760" y2="376" stroke="#f59e0b" stroke-width="2" opacity="0.6"/>

    <text x="480" y="420" text-anchor="middle" font-size="17" fill="#e2e8f0">rootless Podman · systemd --user · per-user storage</text>
    <text x="480" y="452" text-anchor="middle" font-size="15" fill="#cbd5e1">127.0.0.1 只在内网可达，对外只有 nginx 的 80 / 443</text>
    <text x="480" y="492" text-anchor="middle" font-size="14" fill="#93c5fd">权限边界交给机制，而不是自觉</text>
  </g>
</svg>
