name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 说明：本仓库的部署不走 GitHub Actions。
# 自托管环境（阿里云）由开发机上的 scripts/deploy/deploy.sh 推送镜像完成，
# 原因是云服务器在国内，工作流部署从境外 IP 出网会频繁触发阿里云告警。
# 这里只做代码质量门禁。

env:
  BUN_VERSION: '1.3.11'
  NODE_VERSION: '22'

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐿️ Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: ⎔ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 💾 Cache bun dependencies
        uses: actions/cache@v4
        id: bun-cache
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🔍 Lint
        run: bun run app:lint

      - name: 🔍 Type check
        run: cd apps/app && bunx tsc --noEmit
