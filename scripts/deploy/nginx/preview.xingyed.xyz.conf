# 主站分支预览站点（preview.xingyed.xyz）
#
# 安装（需 root）：
#   sudo install -m 644 scripts/deploy/nginx/preview.xingyed.xyz.conf /etc/nginx/sites-available/preview.xingyed.xyz
#   sudo ln -sfn /etc/nginx/sites-available/preview.xingyed.xyz /etc/nginx/sites-enabled/preview.xingyed.xyz
#   sudo nginx -t && sudo systemctl reload nginx
#
# 模板来自 /etc/nginx/sites-enabled/next-app，差别在 server_name、上游端口（3200）与基础认证。

server {
  server_name preview.xingyed.xyz;

  listen [::]:443 ssl;
  listen 443 ssl;
  ssl_certificate /etc/letsencrypt/live/xingyed.xyz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/xingyed.xyz/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  # 预览仅供评审：加一层基础认证，避免爬虫或陌生人访问半成品分支
  # 不需要时删掉下面两行即可
  auth_basic "preview";
  # 注意：该文件属主须为 root:www-data、权限 640。
  # 若设成 root:root 640，nginx worker（www-data）读不到，访问会直接 500，
  # 日志中表现为 open() ".../.htpasswd-preview" failed (13: Permission denied)
  auth_basic_user_file /etc/nginx/.htpasswd-preview;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # 预览环境不加 HSTS/CSP：避免与线上策略耦合，也方便调试

  location / {
    proxy_pass http://127.0.0.1:3200;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;

    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;
  }

  location ~ /\. {
    deny all;
  }
}

server {
  listen 80;
  listen [::]:80;
  server_name preview.xingyed.xyz;

  return 301 https://preview.xingyed.xyz$request_uri;
}
